# Reference copy of /etc/nginx/sites-available/mezon.modeus.cc (certbot adds the 443/TLS lines on the host).
server {
    listen 80;
    listen [::]:80;
    server_name mezon.modeus.cc;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # FastAPI (mezon-backend.service, 127.0.0.1:8000). Same origin: session cookies + SSE work without CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # SSE mentor stream
        proxy_read_timeout 60s;
    }

    # Next.js (mezon-frontend.service, 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
