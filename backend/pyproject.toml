[project]
name = "adolat-backend"
version = "0.1.0"
description = "ADOLAT backend: FastAPI, game engine, legal lookup, RAG, AI mentor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pymongo>=4.8",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: test needs a running Postgres (see tests/conftest.py)",
]
