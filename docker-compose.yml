services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adolat
      POSTGRES_PASSWORD: adolat
      POSTGRES_DB: adolat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adolat -d adolat"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  # S3 storage for the pre-generated speech (same image as vm1, deploy/vm1/storage). Console: http://localhost:9001
  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: adolat
      RUSTFS_SECRET_KEY: adolat-dev-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://adolat:adolat@db:5432/adolat
      MONGO_URL: mongodb://mongo:27017
      SCENARIOS_DIR: /app/scenarios
      SEED_PATH: /seed/seed.sql.gz
      # speech: fill the bucket with TTS_S3_ENDPOINT=http://localhost:9000 python -m app.tts init-bucket / upload
      AUDIO_PUBLIC_BASE_URL: http://localhost:9000/mezon-audio
      AUDIO_MANIFEST_BASE_URL: http://storage:9000/mezon-audio
    volumes:
      - ./scenarios:/app/scenarios:ro
      - ./legal_data:/seed:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # mock: demo backend inside the browser; live: calls the backend under /api (nginx routes it)
        NEXT_PUBLIC_API_MODE: ${FRONTEND_API_MODE:-mock}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  storagedata:
